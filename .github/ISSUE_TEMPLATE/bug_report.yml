name: Bug Report
description: Report a reproducible problem in Echo.
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        For security vulnerabilities, do not open a public issue. Use
        [private vulnerability reporting](https://github.com/sans-script/Echo/security/advisories/new).
        Never attach credentials, private transcripts, account screenshots, or unredacted logs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem without including account data or secrets.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Use synthetic names and paths where possible.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Relevant Versions
      description: Echo commit or version, Windows version, Python version, and provider CLI versions if relevant.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy Check
      options:
        - label: I have removed credentials, tokens, account identifiers, private transcripts, real account screenshots, and unredacted logs.
          required: true
